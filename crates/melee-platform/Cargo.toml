[package]
name = "melee-platform"
description = "Shared native application session and wgpu presentation, with a C ABI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
melee-lib = { path = "../melee-lib" }
melee-replay = { path = "../melee-replay" }
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
melee-test-support = { path = "../melee-test-support" }
