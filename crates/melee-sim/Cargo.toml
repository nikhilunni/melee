melee-ef = { path = "../melee-ef" }
slp = { path = "../slp" }
melee-if = { path = "../melee-if" }
melee-types = { path = "../melee-types" }
hsd-types = { path = "../hsd-types" }
melee-ft = { path = "../melee-ft" }
melee-cpu = { path = "../melee-cpu" }
melee-it = { path = "../melee-it" }
melee-gr = { path = "../melee-gr" }
melee-mp = { path = "../melee-mp" }
melee-lb = { path = "../melee-lb" }
hsd-gobj = { path = "../hsd-gobj" }
hsd-anim = { path = "../hsd-anim" }
hsd-archive = { path = "../hsd-archive" }
gekko-math = { path = "../gekko-math" }
ft-fox = { path = "../ft-fox" }
ft-mars = { path = "../ft-mars" }
ft-falco = { path = "../ft-falco" }
ft-captain = { path = "../ft-captain" }
ft-peach = { path = "../ft-peach" }
ft-yoshi = { path = "../ft-yoshi" }
ft-purin = { path = "../ft-purin" }
ft-mario = { path = "../ft-mario" }
melee-diff = { path = "../melee-diff" }
