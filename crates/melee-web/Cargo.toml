[package]
name = "melee-web"
description = "The browser host's binding to libmelee (melee-platform): wasm-bindgen API mirroring the C API"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm32-only; on other targets this crate is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gc-disc = { path = "../gc-disc" }
melee-lib = { path = "../melee-lib" }
melee-platform = { path = "../melee-platform" }
wgpu = "30"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
