# Build the browser app (WASM + HTML) and publish it to GitHub Pages on every
# push to main. The site contains only our code and the OFL fonts; game data
# is read at runtime from the visitor's own disc image.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/tools
      - name: Build
        run: tools/run-web.sh --build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
