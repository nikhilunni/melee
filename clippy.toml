# Std float methods whose result depends on the target, its libm or an
# unspecified choice. Game code goes through gekko-math instead (CLAUDE.md,
# "Exactness rules"): gekko_math::fma, gekko_math::cmp, gekko_math::msl.
# Only gekko-math itself and tests comparing against std may #[allow] these.
disallowed-methods = [
    { path = "f32::max", reason = "max/min of +0 and -0 is unspecified; use gekko_math::cmp in retail's comparison order" },
    { path = "f32::min", reason = "max/min of +0 and -0 is unspecified; use gekko_math::cmp in retail's comparison order" },
