[project]
name = "melee-harness"
version = "0.0.1"
description = "Dolphin oracle harness: run scenarios, dump state, decode to canonical traces"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "zstandard>=0.25.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
