# Stale moves: an item's hit restales the owner's move in progress.
# Yoshi forward-tilts Fox (stale queue: tilt), throws an egg up (B held 8
# ticks) and starts a second forward tilt at tick 325. The egg hits Fox at
# 327, during the tilt and before its hitbox exists (plStale_UpdateStaleMovesFromItem
# 800373CC: queue egg, tilt); the hitbox made afterwards reads the table then
# (ftColl_8007ABD0 -> ft_80089228), so the tilt does 12 x 0.92 = 11.04
# (0.91 had the multiplier been taken at the tilt's start): 12, 24, 35.04.
