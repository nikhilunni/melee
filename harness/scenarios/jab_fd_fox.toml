# Attacker/defender swap: Fox dashes at the idle Fox and jabs (Attack11) once in range.
# Recorded from the idle_fd_fox savestate (P1 at -60 facing right, P2 at +60 facing
# left, both in Wait). Input frames are VI callbacks counted from the savestate
# load; the port replays the per-tick pad the tick tracer recorded.
name = "jab_fd_fox"
savestate = "harness/roms/idle_fd_fox.sav"
frames = 300
seed = 1
stage = "FinalDestination"

inputs = [
  { frame = 30, buttons = { StickX = 1.0 } },
  { frame = 78, buttons = {} },
  { frame = 112, buttons = { A = true } },
  { frame = 114, buttons = {} },
]

[[fighters]]
slot = 0
kind = "Fox"
controller = "scripted"

[[fighters]]
slot = 1
kind = "Fox"
controller = "idle"
