# right while Peach holds Toad out; the laser meets Toad's front-only
# counter volume (ftColl_8007B1B8, x221B_b3) through ftColl_80077688, and
# onUnkHit enters SpecialNHit (366) from frame 9 with Toad in motion 1
# (it_802BE100). The script releases seven spores (it_802BE214, two
# HSD_Randf draws each, efSync 0x4D3 generators) that drift and expire.
# From the start_fd_peach_fox4 boundary (both fighters in Entry; P1 Peach
# facing right reaches Wait at tick 102). Input frames count tick records.
