# WalkFast: tilt the stick gradually (0.35 -> 0.6 -> 0.95) so the smash window never sees a fresh full tilt; WalkSlow -> WalkMiddle -> WalkFast -> Wait.
# Recorded from the idle_fd_fox savestate (both Foxes in Wait at +-60 on Final
# Destination, P1 facing right). Input frames are VI callbacks counted from the
# savestate load; the port replays the per-tick pad the tick tracer recorded.
name = "walkfast_fd_fox"
savestate = "harness/roms/idle_fd_fox.sav"
frames = 300
seed = 1
stage = "FinalDestination"

inputs = [
  { frame = 30, buttons = { StickX = 0.35 } },
  { frame = 40, buttons = { StickX = 0.6 } },
  { frame = 50, buttons = { StickX = 0.95 } },
  { frame = 75, buttons = {} },
]

[[fighters]]
slot = 0
kind = "Fox"
controller = "scripted"

[[fighters]]
slot = 1
kind = "Fox"
controller = "idle"
