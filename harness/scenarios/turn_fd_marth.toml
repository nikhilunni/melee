# Turn: slow tilt left for 30 VI frames (Turn -> WalkSlow -> Wait) starting from facing right.
# Marth variant of the Fox scenario, same inputs, from the idle_fd_marth savestate
# (P1 Marth and P2 Fox in Wait at +-60 on Final
# Destination, P1 facing right). Input frames are VI callbacks counted from the
# savestate load; the port replays the per-tick pad the tick tracer recorded
# (see tick_trace.py), so VI-to-tick alignment does not need to be exact.
name = "turn_fd_marth"
savestate = "harness/roms/idle_fd_marth.sav"
frames = 300
seed = 1
stage = "FinalDestination"

inputs = [
  { frame = 30, buttons = { StickX = -0.3 } },
  { frame = 60, buttons = {} },
]

[[fighters]]
slot = 0
kind = "Marth"
controller = "scripted"

[[fighters]]
slot = 1
kind = "Fox"
controller = "idle"
