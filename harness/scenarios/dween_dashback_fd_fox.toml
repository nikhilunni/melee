# Dween controller fix witness (slippi-ssbm-asm External/UCF + Arduino Toggle UI/Arduino,
# Gecko hook 0x8006B028 in the input proc, toggle byte 2 for every port).
# Fox (p0) stands facing right; the stick goes 0 -> -40 (tick 120) -> -80 (tick 121).
# RETAIL: the tilt at tick 120 is held at zero (Fox stays in Wait), so the full stick
# at 121 is a fresh tap: Turn at 121, Dash at 122 facing left. Without the code the
# slow Turn starts at 120 and Dash at 125 (ucf_dashback_fd_fox_off).
name = "dween_dashback_fd_fox"
input_clock = "tick"
savestate = "harness/roms/start_fd_fox4.sav"
frames = 200
seed = 1
stage = "FinalDestination"
gecko = ["dween"]
inputs = [
  { frame = 120, port = 0, buttons = { StickX = -0.5 }, raw = { stickX = -40 } },
  { frame = 121, port = 0, buttons = { StickX = -1.0 }, raw = { stickX = -80 } },
  { frame = 150, port = 0, buttons = {  }, raw = {  } },
]

[[fighters]]
slot = 0
kind = "Fox"
controller = "scripted"
controller_fix = "dween"

[[fighters]]
slot = 1
kind = "Marth"
controller = "idle"
controller_fix = "dween"
