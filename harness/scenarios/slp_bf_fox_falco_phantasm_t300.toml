# Tournament inputs as a retail witness: the first 300 ticks of a Slippi 2.0.1
# console game (HNC 9, Fox port 1 vs Falco port 3, Battlefield, neutral spawns,
# UCF), fed tick for tick from a neutral-spawn boundary; scenario frame N+1 is
# replay tick N. Falco is slot 1 here (slot 2 in the replay), so his Entry ends
# five ticks sooner and his first stick input waits one tick (frame 90) to
# start the same Turn. At frame 269 Fox, falling off the left platform after
# DownFowardD, is 7.6 in front of Falco's aerial Phantasm start: the ghost
# article's first hitbox frame, a point capsule at the start position. Its
# radius is the command size (4.16) times the article's scale (1.1), since
# it_80274594 restores x3C after the hitbox command divided by scl: the
# capsule reaches Fox's shin by 0.24 and retail hits (DamageFlyLw).
