# Tech: Marth dashes in, grabs the idle Fox and back-throws him (as grab_fd_marth);
# Fox (port 1 script) holds L with the stick toward the stage centre just before
# landing so he techs (TechU / tech roll) instead of DownBoundU.
# Recorded from the idle_fd_marth savestate (P1 at -60 facing right, P2 at +60
# facing left, both in Wait). Input frames are VI callbacks counted from the
# savestate load; the port replays the per-tick pad the tick tracer recorded.
name = "tech_fd_marth"
savestate = "harness/roms/idle_fd_marth.sav"
frames = 300
seed = 1
stage = "FinalDestination"

inputs = [
  { frame = 30, buttons = { StickX = 1.0 } },
  { frame = 88, buttons = {} },
  { frame = 120, buttons = { Z = true } },
  { frame = 122, buttons = {} },
  { frame = 140, buttons = { StickX = -1.0 } },
  { frame = 145, buttons = {} },
  { frame = 158, port = 1, buttons = { L = true, TriggerLeft = 1.0, StickX = -1.0 } },
  { frame = 166, port = 1, buttons = {} },
]

[[fighters]]
slot = 0
kind = "Marth"
controller = "scripted"

[[fighters]]
slot = 1
kind = "Fox"
controller = "idle"
