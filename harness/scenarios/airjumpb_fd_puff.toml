# Backward double jump: full hop, then stick back plus X in the air
# (JumpAerialB keeps the facing), then drift forward again and land on stage
# (Marth's longer drift carried the Fox timing off the edge to a death).
# Marth variant of the Fox scenario, same inputs, from the idle_fd_fox savestate
# (P1 Marth and P2 Fox in Wait at +-60 on Final
# Destination, P1 facing right). Input frames are VI callbacks counted from the
# savestate load; the port replays the per-tick pad the tick tracer recorded.
name = "airjumpb_fd_puff"
savestate = "harness/roms/idle_fd_puff.sav"
frames = 300
seed = 1
stage = "FinalDestination"

inputs = [
  { frame = 30, buttons = { X = true } },
  { frame = 36, buttons = {} },
  { frame = 50, buttons = { StickX = -1.0, X = true } },
  { frame = 53, buttons = { StickX = -1.0 } },
  { frame = 62, buttons = { StickX = 1.0 } },
  { frame = 100, buttons = {} },
]

[[fighters]]
slot = 0
kind = "Jigglypuff"
controller = "scripted"

[[fighters]]
slot = 1
kind = "Fox"
controller = "idle"
