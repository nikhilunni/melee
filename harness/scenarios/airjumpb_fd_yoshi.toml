# Backward double jump: full hop, then stick back plus X in the air
# (JumpAerialB keeps the facing), drift back and land.
# Yoshi variant of the Fox scenario, same inputs, from the idle_fd_yoshi savestate
# (P1 Yoshi and P2 Fox in Wait at +-60 on Final
# Destination, P1 facing right). Input frames are VI callbacks counted from the
# savestate load; the port replays the per-tick pad the tick tracer recorded.
# Drift back at VI 58: Yoshi's double jump carries him far; the Fox timing ends in a death.
name = "airjumpb_fd_yoshi"
savestate = "harness/roms/idle_fd_yoshi.sav"
frames = 300
seed = 1
stage = "FinalDestination"

inputs = [
  { frame = 30, buttons = { X = true } },
  { frame = 36, buttons = {} },
  { frame = 50, buttons = { StickX = -1.0, X = true } },
  { frame = 53, buttons = { StickX = -1.0 } },
  { frame = 58, buttons = { StickX = 1.0 } },
  { frame = 110, buttons = {} },
]

[[fighters]]
slot = 0
kind = "Yoshi"
controller = "scripted"

[[fighters]]
slot = 1
kind = "Fox"
controller = "idle"
