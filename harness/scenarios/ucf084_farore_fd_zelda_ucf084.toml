# UCF 0.84 witness, the cardinal exemption (UCF Pad Buffer + 1.0
# Cardinals.asm at 0x8006B460: `lwz 4 == 19 && lwz 0x10 == 349` skips both
# sticks). Zelda (p0) starts Farore's Wind on the ground (tick 120) and
# holds the raw stick at (100, 5) from 124: HSD clamps it to 0.9875. On the
# start's last frame (still ftZd_MS_SpecialHiStart_0, 349) ftZd_SpecialHi_8013A058
# reads that stick unsnapped, so she travels along the floor at
# (x54 * 0.9875 + x58), not at the snapped 1.0 the code gives every other
# motion.
name = "ucf084_farore_fd_zelda_ucf084"
input_clock = "tick"
savestate = "harness/roms/start_fd_zelda_fox4.sav"
frames = 300
seed = 1
stage = "FinalDestination"
gecko = ["ucf-0.84"]
inputs = [
  { frame = 1, port = 0, buttons = {  }, raw = {  } },
  { frame = 1, port = 1, buttons = {  }, raw = {  } },
  { frame = 120, port = 0, buttons = {  }, raw = { button = 512, stickY = 80 } },
  { frame = 124, port = 0, buttons = {  }, raw = { stickX = 100, stickY = 5 } },
  { frame = 180, port = 0, buttons = {  }, raw = {  } },
]

[[fighters]]
