# SLOPE witness: the ground pose's body tilt (ft_80089B08, ft_0899.c:180-232) on Yoshi's Story's
# side slopes (floor normal x = +/-0.204, tilt 0.2054 rad, inside the 20-degree x804 clamp). Fox and
# Marth drop through the side platforms at 200 and land on the slopes (Fox at -51.8, Marth at 46.8).
# Retail sets the tilt bit (x221C bit 2) only from attack subactions: Marth's forward smashes (260,
# 320, 380) and down smash (440), Fox's down smashes (440 at -56 and 560 at -43.8, after a short-hop
# dair landing), and Marth's turn-around forward smash (600) with facing -1, tilting -0.2054. Fox's
# forward smash slides it to the stage edge (-56) without tilting. Recorded with --bones 680: the tilt
# shows only in the joints (bones-diff), not in the tick keys.
