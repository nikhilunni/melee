# Ledge: a backward full hop (stick left + X, facing stays right) drifting left past
# the left edge, then drift back right while falling to grab the ledge facing it
# (CliffCatch -> CliffWait), then tilt up to climb.
# Recorded from the idle_fd_fox savestate (both Foxes in Wait at +-60 on Final
# Destination, P1 facing right). Input frames are VI callbacks counted from the
# savestate load; the port replays the per-tick pad the tick tracer recorded.
name = "ledge_fd_fox"
savestate = "harness/roms/idle_fd_fox.sav"
frames = 420
seed = 1
stage = "FinalDestination"

inputs = [
  { frame = 30, buttons = { StickX = -1.0, X = true } },
  { frame = 36, buttons = { StickX = -1.0 } },
  { frame = 72, buttons = { StickX = 1.0 } },
  { frame = 200, buttons = {} },
  { frame = 230, buttons = { StickY = 1.0 } },
  { frame = 260, buttons = {} },
]

[[fighters]]
slot = 0
kind = "Fox"
controller = "scripted"

[[fighters]]
slot = 1
kind = "Fox"
controller = "idle"
