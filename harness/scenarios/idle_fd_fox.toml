# Milestone 3 scenario: one Fox, Final Destination, no input, fixed seed.
# The savestate is machine-local (it embeds your disc's data) and lives under
# harness/roms/, which is gitignored. Record it once with Dolphin at the first
# frame of the match, then everything downstream is deterministic.
name = "idle_fd_fox"
savestate = "harness/roms/idle_fd_fox.sav"
frames = 600
seed = 1
stage = "FinalDestination"

[[fighters]]
slot = 0
kind = "Fox"
controller = "scripted"

inputs = []   # no input for 600 frames
