# HELD ITEM directed witness (Peach's turnips, start_fd_peach_fox4 boundary:
# P1 Peach at x=-60 facing right, P2 Fox idle at x=60). Four pulls, four
# throws:
# - a dash, then A on its second frame: LightThrowF4 through Dash's interrupt
#   friction (ftCo_Dash_IASA, retail 0x800CA2AC b .L_800CA500);
# - a dash, then the C-stick backward: LightThrowB4 from checkItemThrow
#   (ftCo_AttackS4_8008C114, retail 0x8008C1E4), the facing unchanged;
# - a jump, then A in the jump squat: ftCo_Catch_CheckInput's ground throw
#   (ftCo_800951D0, called from ftCo_KneeBend_IASA);
# - a dash jump, then A on the way up with the stick still forward: the
#   smash air throw LightThrowAirF4, timed by x673 (retail 0x800953DC), which
#   Dash's entry does not reset as it does x670.
