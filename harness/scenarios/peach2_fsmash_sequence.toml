# PEACH2 forward smash (ftPe_AttackS4_Enter): three swings in a row, each
# chosen by HSD_Randi(3) among club, pan and racket (349..351) and redrawn
# while it repeats the previous one (fp->u.pe.attacks4_motion_id). The
# second is charged by holding A (the script's smash charge), the third is
# aimed left, turning Peach round (decideFighter's facing).
# From the start_fd_peach_fox4 boundary (both fighters in Entry; P1 Peach
# facing right reaches Wait at tick 102). Input frames count tick records.
name = "peach2_fsmash_sequence"
input_clock = "tick"
savestate = "harness/roms/start_fd_peach_fox4.sav"
frames = 360
seed = 1
stage = "FinalDestination"

