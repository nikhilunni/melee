# Grab and throw: Marth dashes in, stops, grabs the idle Fox (Z) and forward-throws (stick forward).
# Recorded from the idle_fd_marth savestate (P1 at -60 facing right, P2 at +60 facing
# left, both in Wait). Input frames are VI callbacks counted from the savestate
# load; the port replays the per-tick pad the tick tracer recorded.
name = "grab_fd_marth"
savestate = "harness/roms/idle_fd_marth.sav"
frames = 300
seed = 1
stage = "FinalDestination"

inputs = [
  { frame = 30, buttons = { StickX = 1.0 } },
  { frame = 88, buttons = {} },
  { frame = 120, buttons = { Z = true } },
  { frame = 122, buttons = {} },
  { frame = 140, buttons = { StickX = 1.0 } },
  { frame = 145, buttons = {} },
]

[[fighters]]
slot = 0
kind = "Marth"
controller = "scripted"

[[fighters]]
slot = 1
kind = "Fox"
controller = "idle"
