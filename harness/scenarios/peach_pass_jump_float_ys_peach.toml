# PEACH directed witness: the jump out of a platform drop with the stick
# down. From the start_ys_peach_yoshi4 boundary Peach stands on Yoshi's
# Story's left platform, holds the stick down (Squat, then Pass) and presses
# Y: ftCo_Pass_IASA (8009A2D8) has no float check (Fall's ftPe_8011BA54
# before the aerial jump is absent), so its last call ftCo_800CB870
# (0x8009A36C) starts the aerial jump, and JumpAerial's own check starts the
# float one tick later.
