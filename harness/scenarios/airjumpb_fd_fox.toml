# Backward double jump: full hop, then stick back plus X in the air
# (JumpAerialB keeps the facing), drift back and land.
# Recorded from the idle_fd_fox savestate (both Foxes in Wait at +-60 on Final
# Destination, P1 facing right). Input frames are VI callbacks counted from the
# savestate load; the port replays the per-tick pad the tick tracer recorded.
name = "airjumpb_fd_fox"
savestate = "harness/roms/idle_fd_fox.sav"
frames = 300
seed = 1
stage = "FinalDestination"

inputs = [
  { frame = 30, buttons = { X = true } },
  { frame = 36, buttons = {} },
  { frame = 50, buttons = { StickX = -1.0, X = true } },
  { frame = 53, buttons = { StickX = -1.0 } },
  { frame = 80, buttons = {} },
]

[[fighters]]
slot = 0
kind = "Fox"
controller = "scripted"

[[fighters]]
slot = 1
kind = "Fox"
controller = "idle"
