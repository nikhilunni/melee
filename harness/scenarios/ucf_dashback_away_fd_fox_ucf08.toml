# UCF dashback witness, the stick away from the turn (Gecko hook 0x800C9A44
# in ftCo_Turn_IASA): where 0.73 and 0.74 differ. Fox (p0) stands facing
# right; the stick goes 0 -> -40 (tilt: a slow Turn to the left at tick 120)
# -> +80 at tick 121, the Turn's second animation frame: a full stick, a raw
# change of 80 over two ticks, but back toward the old facing.
# UCF 0.8 (External/UCF 0.8/Logic/UCF DB.asm, the 0.74 program) takes the
# stick's absolute value: the turn becomes a smash turn and Fox faces left
# from tick 121, with no dash (the stick is not toward the new facing).
name = "ucf_dashback_away_fd_fox_ucf08"
input_clock = "tick"
savestate = "harness/roms/start_fd_fox4.sav"
frames = 200
seed = 1
stage = "FinalDestination"
gecko = ["ucf-0.8"]
inputs = [
  { frame = 120, port = 0, buttons = { StickX = -0.5 }, raw = { stickX = -40 } },
  { frame = 121, port = 0, buttons = { StickX = 1.0 }, raw = { stickX = 80 } },
  { frame = 150, port = 0, buttons = {}, raw = {} },
]

[[fighters]]
slot = 0
kind = "Fox"
controller = "scripted"
controller_fix = "ucf-0.8"

[[fighters]]
slot = 1
kind = "Marth"
controller = "idle"
controller_fix = "ucf-0.8"
