# tick was found with `melee-sim search` over the down-B tick, 2151
# candidates, 5 Bob-ombs). Peach pulls an unlit Bob-omb on the left
# platform at 490, drops through it (540), jumps (600) and double-jumps
# (614), and at 636, her hand just above the platform, drops it with A + R
# (it_3F14_Logic6_Dropped, state 9). It lands softly on the platform
# (fn_80280974: |v| within x20/x24), walks (state 2, it_8027EE04), turns at
# the platform's edges (it_8027F42C, state 4) and, when its walk timer
# (x10 = 160 frames) runs out, lights (it_8027F8E0 with xDE0 == 0: the
# blink, the common item lifetime and the fuse, state 5), burns x8 = 90
# frames and explodes. Peach drifts right and waits on the ground.
# Input frames count ticks.
