# WIDESCREEN witness (slippi-ssbm-asm External/Widescreen: CObjLoad's aspect
# hook 0x8036A4A8 and Camera_80030BBC's bounds 100 / 540 at 0x80030C7C /
# 0x80030C88), from start_ps_wide_marth_jigglypuff4, a boundary booted with
# the Gecko code so the main CObj was loaded with the wide aspect.
# Jigglypuff drifts off Pokemon Stadium's right side and hovers at x = 170.2
# with her jumps; Marth idles. With the code the on-screen test still passes
# where the 4:3 screen's has failed, so the magnifier's first point of damage
# (Fighter_8006A360, sixty magnified ticks) comes at tick 352; retail without
# the code (standard_hover_slow_ps_marth_jigglypuff4, the same pads) has it
# at 341, and the port without the code leaves this recording at tick 340.
