# Launch: Marth dashes in, stops, and up-tilts (stick 0.35 up + A) the idle Fox:
# DamageFly upward, tumble (DamageFall), landing on stage (missed tech / DownBound).
# Recorded from the idle_fd_marth savestate (P1 at -60 facing right, P2 at +60 facing
# left, both in Wait). Input frames are VI callbacks counted from the savestate
# load; the port replays the per-tick pad the tick tracer recorded.
name = "utilt_fd_marth"
savestate = "harness/roms/idle_fd_marth.sav"
frames = 300
seed = 1
stage = "FinalDestination"

inputs = [
  { frame = 30, buttons = { StickX = 1.0 } },
  { frame = 88, buttons = {} },
  { frame = 120, buttons = { StickY = 0.35, A = true } },
  { frame = 123, buttons = {} },
]

[[fighters]]
slot = 0
kind = "Marth"
controller = "scripted"

[[fighters]]
slot = 1
kind = "Fox"
controller = "idle"
