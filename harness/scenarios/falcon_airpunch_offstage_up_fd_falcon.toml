# FALCON: aerial Falcon Punch off the left edge after a jump and a double
# jump, long enough in the air for the script's cmd_vars[0] lunge
# (ftCa_SpecialAirN_IASA) with the stick held up, then the cmd_vars[1]
# decay and ft_80084DB0 phases.
# From the idle_fd_falcon savestate (P1 Captain Falcon and P2 Fox in Wait at
# +-60 on Final Destination, P1 facing right). Input frames are VI callbacks
# counted from the savestate load.
name = "falcon_airpunch_offstage_up_fd_falcon"
savestate = "harness/roms/idle_fd_falcon.sav"
frames = 200
seed = 1
stage = "FinalDestination"

inputs = [
  { frame = 30, buttons = { StickX = -1.0 } },
  { frame = 44, buttons = { X = true, StickX = -1.0 } },
  { frame = 48, buttons = { StickX = -1.0 } },
  { frame = 60, buttons = { X = true, StickX = -1.0 } },
  { frame = 62, buttons = {} },
  { frame = 72, buttons = { B = true } },
  { frame = 75, buttons = {} },
  { frame = 100, buttons = { StickY = 0.8 } },
  { frame = 180, buttons = {} },
]

[[fighters]]
slot = 0
kind = "CaptainFalcon"
controller = "scripted"

[[fighters]]
slot = 1
kind = "Fox"
controller = "idle"
