# Dween controller fix witness (slippi-ssbm-asm External/UCF + Arduino Toggle UI/Arduino,
# Gecko hook 0x8006B028 in the input proc, toggle byte 2 for every port).
# Fox (p1) stands on Battlefield's top platform and shields (R, tick 120); the stick
# tilts right (40, tick 130) and, six ticks later, moves to (56, -56) on the rim.
# RETAIL: the stick becomes the notch (0.725, -0.6875), short of the spot dodge line:
# Fox drops through the platform (Pass 244) at tick 136. Without the code he spot
# dodges (ucf_shielddrop_bf_fox_off).
name = "dween_shielddrop_bf_fox"
input_clock = "tick"
savestate = "harness/roms/start_bf_marth_fox4.sav"
frames = 200
seed = 1
stage = "Battlefield"
gecko = ["dween"]
inputs = [
  { frame = 120, port = 1, buttons = { R = true, TriggerRight = 1.0 }, raw = { button = 32, triggerR = 140 } },
  { frame = 130, port = 1, buttons = { R = true, TriggerRight = 1.0, StickX = 0.5 }, raw = { button = 32, triggerR = 140, stickX = 40 } },
  { frame = 136, port = 1, buttons = { R = true, TriggerRight = 1.0, StickX = 0.7, StickY = -0.7 }, raw = { button = 32, triggerR = 140, stickX = 56, stickY = -56 } },
  { frame = 160, port = 1, buttons = {  }, raw = {  } },
]

[[fighters]]
slot = 0
kind = "Marth"
controller = "idle"
controller_fix = "dween"

[[fighters]]
slot = 1
kind = "Fox"
controller = "scripted"
controller_fix = "dween"
