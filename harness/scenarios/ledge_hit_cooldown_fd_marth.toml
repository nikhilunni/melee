# A fighter hit out of a ledge state cannot regrab for the ledge cooldown.
# Marth hangs on Final Destination's left ledge (CliffWait from tick 108) and
# ledge-attacks at 150 (CliffAttackQuick, x221D_b7 still set). Fox's forward
# tilt hits him on the stage at tick 169 (9%, DamageN2), and the knockback
# slides him back off the edge: MissFoot from 179, facing the ledge 4.3 units
# away. ftCo_8008E908 (0x8008E908) started the ledge cooldown (PlCo +498, 30
# ticks, not counted in hitlag) when the hit landed, so he falls through the
# whole grab range without catching (it runs out on tick 205, as MissFoot
# ends 29.8 below the ledge). He then jumps back and catches it normally.
# Boundary: idle_fd_marth.sav; tick clock.
