# 341: the egg's startup, every hurt capsule HurtCapsule_Invincible, the
# shield bubble still small). The laser misses the bubble and touches a hurt
# capsule: retail's ftColl_80077C60 (ftcoll.c:1271) records the item's victim
# and its dealt damage but logs nothing, so Yoshi takes no damage, hitlag or
# knockback, and the laser is destroyed on its hit.
