# SLOPE witness: Yoshi's Story's side slopes without body tilt. Fox and Marth walk out on the side
# platforms (140-165), crouch through them at 200 and land on the slopes (Fox at -51.8, Marth at
# 46.8), stand, walk inward (260-280), crouch (300-330) and walk back out (340-355). Retail never sets
# the ground pose's tilt bit (x221C bit 2, ft_80089B08) in Wait, Walk, Squat or Landing: the root's
# rotation x stays 0 on the slope (bones match with --bones 400), so only attack subactions tilt the
# body (slope_ys_smash_fox_marth).
