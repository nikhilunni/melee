# Retail match-start boundaries that the port's cold construction reproduces
# exactly: the explorer's starting points (`--boundary <name>`). A recording
# made with the same stage, players, stocks and seed replays in Dolphin from
# `savestate` through replay_to_scenario.py. Every non-Sudden-Death entry is
# checked by melee-lib's `registered_boundaries_cold_600` (initial scene,
# particles, 600 gated ticks).
#
# To add one: `cd harness && uv run python make_boundary.py --stage <Stage>
# --players <P1> <P2> [--stocks N]`. It drives the menus in headless Dolphin,
# saves roms/<name>.sav, writes <name>.toml and <name>_cold.toml, records,
# gates, and appends the entry here when the port matches.

[[boundary]]
name = "start_fd_fox4"
cold = "start_fd_fox4_cold"
savestate = "harness/roms/start_fd_fox4.sav"
stage = "FinalDestination"
players = ["Fox", "Marth"]
stocks = 4
seed = 2477457595

